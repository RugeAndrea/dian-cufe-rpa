services:
  rpa:
    build: .
    image: dian-cufe-rpa:latest
    platform: linux/amd64  # google-chrome-stable solo publica amd64; Docker
                           # Desktop en Apple Silicon emula vía Rosetta.
    shm_size: "2gb"
    env_file:
      - path: .env
        required: false
    environment:
      HEADLESS: "false"
    volumes:
      - ./output:/app/output
      - ./data:/app/data
      - ./samples:/app/samples
    command: ["python", "-m", "src.main", "rpa"]
